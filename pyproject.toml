[project]
name = "nonebot-plugin-uptimekuma"
version = "0.1.1"
description = "Monitor NoneBot and adapter account connections with Uptime Kuma Push Monitor"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "httpx>=0.27", "nonebot2>=2.5" ]

[tool.ruff]
target-version = "py310"
line-length = 120
format.quote-style = "single"
lint.select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle errors
  "EM",    # flake8-errmsg
  "ERA",   # eradicate
  "F",     # pyflakes
  "FA",    # flake8-future-annotations
  "FAST",  # FastAPI
  "FBT",   # flake8-boolean-trap
  "FLY",   # flynt
  "FURB",  # refurb
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "ISC",   # flake8-implicit-str-concat
  "N",     # PEP8-naming
  "PD",    # pandas-vet
  "PERF",  # Perflint
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # Ruff-specific rules
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
  "YTT",   # flake8-2020
]
lint.ignore = [
  "ANN202", # 向 NoneBot 注册的函数
  "COM812", # 强制尾随逗号
  "E501",   # 过长的行由 ruff format 处理, 剩余的都是字符串
  "ISC001", # format warning
  "TID252", # 相对导入
  "TRY003",
  "FA100",  # 禁止 from __future__ import annotations
  "FA102",  # 禁止 from __future__ import annotations
]
lint.flake8-annotations.mypy-init-return = true
lint.flake8-builtins.builtins-ignorelist = [ "id" ]
lint.flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
lint.per-file-ignores = { "tests/**/*.py" = [ "E402", "PLC0415", "PLR2004", "S101", "SLF001" ] }

[tool.bumpversion]
current_version = "0.1.1"
tag = true
commit_args = "-S"
sign_tags = true
tag_name = "{new_version}"
commit = true
message = "🔖 {new_version}"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = [ "." ]

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
enableTypeIgnoreComments = false
defineConstant = { PYDANTIC_V2 = true }
reportExplicitAny = "hint"
reportImplicitAbstractClass = "error"
reportImplicitOverride = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "bump-my-version>=1.3.0",
    "nonebug>=0.4.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.15",
]
